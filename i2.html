<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SockStore - Contacto</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="header">
    <a href="index.html" class="logo">SockStore</a>
<button id="hamburger-btn" class="hamburger" aria-label="Abrir Menú">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="3" y1="12" x2="21" y2="12"></line>
    <line x1="3" y1="6" x2="21" y2="6"></line>
    <line x1="3" y1="18" x2="21" y2="18"></line>
  </svg>
</button>
    <nav id="nav-menu" class="nav-menu">
      <a href="inicio.html">Inicio</a>
      <a href="index.html">Productos</a>
      <a href="i2.html">Formulario</a>
    </nav>
  </header>

  <main>
    <section class="section">
      <h2>Formulario de Contacto</h2>

      <div data-fs-success class="alert-success"></div>
      <div data-fs-error class="alert-error"></div>

      <form id="my-form" class="form">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required data-fs-field />
        <span data-fs-error="email" class="error-msg"></span>

        <label for="message">Mensaje</label>
        <textarea id="message" name="message" rows="4" required data-fs-field></textarea>
        <span data-fs-error="message" class="error-msg"></span>

        <button type="submit" data-fs-submit-btn>Enviar</button>
      </form>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 SockStore</p>
  </footer>

  <script>
    window.formspree = window.formspree || function () { (formspree.q = formspree.q || []).push(arguments); };
    formspree('initForm', { formElement: '#my-form', formId: 'myegbneg' });
  </script>
  <script src="https://unpkg.com/@formspree/ajax@1" defer></script>
  <script src="main.js"></script>
</body>
</html>
